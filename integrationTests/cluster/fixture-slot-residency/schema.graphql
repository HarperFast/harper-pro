type SlotKeys @table(replicaExpiration: 3600) @export @sharded(slots: 10, slotFrom: "Number(id.slice(-1))") {
	id: ID @primaryKey
	tag: String @indexed
	body: String
}
type SlotAttributes @table(replicaExpiration: 3600) @export @sharded(slots: 10, by: "region", slotFrom: "region") {
	id: ID @primaryKey
	region: Int @indexed
	tag: String @indexed
	body: String
}
type SlotHash @table @export @sharded(slots: 10) {
	id: ID @primaryKey
	tag: String @indexed
	body: String
}
type SlotNoIndex @table @export @sharded(slots: 10, slotFrom: "Number(id.slice(-1))") {
	id: ID @primaryKey
	body: String
}
type SlotBarrier @table @export {
	id: ID @primaryKey
}
type SlotBlob @table @export @sharded(slots: 10, by: "region", slotFrom: "region") {
	id: ID @primaryKey
	region: Int @indexed
	payload: Blob
}
type SlotLegacy @table @export {
	id: ID @primaryKey
	body: String
}

type SlotTenant @table @export @sharded(by: "tenantId") {
	id: ID @primaryKey
	tenantId: Any @indexed
	body: String
}
type SlotRegional @table @export @sharded(by: "region", slotFrom: "region == 'asia' ? 1 : 2") {
	id: ID @primaryKey
	region: String @indexed
	body: String
}
