name: Unit Tests

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests (Node.js v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      # re2 downloads its native binary from a post-install script (unlike lmdb/msgpackr/rocksdb,
      # which bundle prebuilds), so --ignore-scripts above leaves it absent. Materialize it here.
      - name: Build re2 native binary
        run: npm rebuild re2

      - name: Build
        run: npm run build || true

      - name: Run unit tests
        run: npm run test:unit
