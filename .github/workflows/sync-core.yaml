name: Sync Core

on:
  schedule:
    # Nightly at 07:00 UTC (~midnight PT / 03:00 ET)
    - cron: '0 7 * * *'
  repository_dispatch:
    types: [sync_core]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-core:
    runs-on: ubuntu-latest
    steps:
      # Mint a GitHub App token so the PR is authored by the HarperFast AI
      # App, not GITHUB_TOKEN. This is required for downstream `pull_request`
      # workflows (integration-tests, lint) to run on the PR — without them,
      # auto-merge has no checks to gate on.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HARPERFAST_AI_CLIENT_ID }}
          private-key: ${{ secrets.HARPERFAST_AI_APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'

      # A coordinated PR may have merged a core:set-branch override; the sync
      # must always track main, and this repairs .gitmodules in the sync PR.
      # Release-line dispatches keep their own tracking.
      - name: Reset core branch tracking
        if: github.ref_name == github.event.repository.default_branch
        run: git submodule set-branch --branch main core

      - name: Sync core
        env:
          CORE_SYNC_WARNING_FILE: ${{ runner.temp }}/core-sync-warning.md
        run: npm run core:sync

      # core-sync-guard.sh's warning, when the move drops changes the previous pointer had, leads the PR body
      - name: Compose pull request body
        env:
          WARNING_FILE: ${{ runner.temp }}/core-sync-warning.md
          BODY_FILE: ${{ runner.temp }}/core-sync-body.md
        run: |
          {
            if [[ -s "$WARNING_FILE" ]]; then
              cat "$WARNING_FILE"
              echo
              echo
            fi
            echo 'Sync core submodule and update package.json dependencies.'
            echo 'This PR was automatically created by the Sync Core workflow.'
            echo
            echo 'Auto-merge is enabled: this PR will merge automatically once'
            echo 'required status checks pass. If checks fail, the PR stays open'
            echo 'for manual review.'
          } >"$BODY_FILE"
          if [[ -s "$WARNING_FILE" ]]; then
            cat "$WARNING_FILE" >>"$GITHUB_STEP_SUMMARY"
            echo "::warning title=Core sync may drop changes::See the job summary and the Sync Core PR body"
          fi

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'feat: Sync Core'
          branch: sync-core-submodule
          title: 'chore: Sync Core'
          body-path: ${{ runner.temp }}/core-sync-body.md
          labels: |
            automated pr
            core sync

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge --auto --squash --delete-branch \
            "${{ steps.cpr.outputs.pull-request-number }}"
