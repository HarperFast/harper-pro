name: Large-Data Stress Tests

# Catch-up and clone performance at production data scale (10–20 GB).
# Requires the self-hosted harper-bench runner (adequate disk, no GH runner
# disk cap). Runs nightly to catch replication throughput regressions early.

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version'
        required: true
        type: choice
        default: '24'
        options:
          - '22'
          - '24'
          - '25'
      data-gb:
        description: 'Dataset size in GB'
        required: false
        default: '10'
      test-filter:
        description: 'Which test to run (leave blank for both)'
        required: false
        type: choice
        default: 'both'
        options:
          - 'both'
          - 'large-catchup'
          - 'large-clone'
  schedule:
    # 06:00 UTC nightly (midnight MDT)
    - cron: '0 6 * * *'

# The `harper-bench` self-hosted box is shared with ycsb-cluster-nightly.yml. GitHub
# concurrency groups are repo-scoped and matched by name across workflows, so using the
# same group name in both serializes them on that one box. cancel-in-progress: false so a
# queued run waits for the in-progress test rather than killing it mid-run.
concurrency:
  group: harper-bench-exclusive
  cancel-in-progress: false

jobs:
  build:
    name: Build Harper Pro (Node.js v${{ inputs.node-version || '24' }})
    runs-on: [self-hosted, harper-bench]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
      - name: Setup Node.js ${{ inputs.node-version || '24' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version || '24' }}
          package-manager-cache: false
      - name: Install dependencies
        run: |
          n=0
          until npm install; do
            n=$((n + 1))
            if [ "$n" -ge 4 ]; then
              echo "::error::npm install failed after $n attempts"
              exit 1
            fi
            delay=$((n * 30))
            echo "npm install failed (attempt $n/4); retrying in ${delay}s..."
            sleep "$delay"
          done
      - name: Build
        run: npm run build || true
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-large-stress-build-${{ inputs.node-version || '24' }}
          path: |
            dist/
            static/
            node_modules/
            package.json
          retention-days: 1

  large-data-stress:
    name: Large-data ${{ matrix.test.name }} (Node.js v${{ inputs.node-version || '24' }})
    needs: build
    runs-on: [self-hosted, harper-bench]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        test:
          - name: 'large-catchup'
            file: 'integrationTests/stress/largeCatchup.test.mjs'
          - name: 'large-clone'
            file: 'integrationTests/stress/largeClone.test.mjs'
        exclude:
          - test:
              name: ${{ (inputs.test-filter == 'large-clone') && 'large-catchup' || '' }}
          - test:
              name: ${{ (inputs.test-filter == 'large-catchup') && 'large-clone' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
      - name: Setup Node.js ${{ inputs.node-version || '24' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version || '24' }}
          package-manager-cache: false
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harper-large-stress-build-${{ inputs.node-version || '24' }}
      # The artifact-restored node_modules/ already has everything resolved; this only needs to
      # recreate node_modules/.bin symlinks, so --offline keeps it off the registry entirely
      # (a registry 5xx here previously killed the nightly before any test ran, gh#630).
      - name: Relink bin scripts
        run: npm rebuild --ignore-scripts --offline
      # re2 downloads its native binary from a post-install script (unlike lmdb/msgpackr/rocksdb,
      # which bundle prebuilds), so --ignore-scripts above leaves it absent. Materialize it here.
      # This does touch the network (GitHub releases, not the npm registry), so retry on blips.
      - name: Build re2 native binary
        run: |
          n=0
          until npm rebuild re2; do
            n=$((n + 1))
            if [ "$n" -ge 4 ]; then
              echo "::error::npm rebuild re2 failed after $n attempts"
              exit 1
            fi
            delay=$((n * 30))
            echo "npm rebuild re2 failed (attempt $n/4); retrying in ${delay}s..."
            sleep "$delay"
          done
      - name: Run ${{ matrix.test.name }}
        env:
          HARPER_RUN_STRESS_TESTS: '1'
          HARPER_INTEGRATION_TEST_LOG_DIR: /home/runner/harper-large-stress-logs
          HARPER_INTEGRATION_TEST_INSTALL_PARENT_DIR: /home/runner
          HARPER_STRESS_LARGE_DATA_GB: ${{ inputs.data-gb || '10' }}
        run: |
          # No coverage: run.mjs's run() defaults coverage off, and passing
          # --experimental-test-coverage (even =false) actually ENABLES collection —
          # its mere presence turns it on. On a ~400s stress run the coverage blob is
          # huge and its serialization across the process-isolation boundary truncates,
          # which node:test then reports as a file-level failure even when every test
          # passes. Omitting the flag keeps coverage off and the run clean.
          node integrationTests/run.mjs ${{ matrix.test.file }}
      - name: Upload Harper server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: large-stress-logs-${{ matrix.test.name }}-node-${{ inputs.node-version || '24' }}
          path: /home/runner/harper-large-stress-logs/
          retention-days: 7
          if-no-files-found: ignore
