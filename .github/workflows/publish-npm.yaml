name: Publish NPM Package

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-npm-package:
    runs-on: ubuntu-latest
    outputs:
      harper-pro-version: ${{ steps.version-components.outputs.version }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get release build
        env:
          GH_TOKEN: ${{ github.token }}
        # Retry up to 5 times with 15s backoff: GitHub can briefly make assets
        # unavailable via the API when a draft release is published.
        run: |
          for i in 1 2 3 4 5; do
            gh release download ${{ github.event.release.tag_name }} --pattern "harperfast-harper-pro-*.tgz" && break
            if [ "$i" -eq 5 ]; then echo "All attempts failed"; exit 1; fi
            echo "Attempt $i failed; retrying in 15s..."
            sleep 15
          done
      - name: Get version components
        id: version-components
        uses: matt-usurp/validate-semver@c5050374644a5ab2e03ddca02ce8d282911620ce # v3.0.0
        with:
          version: ${{ github.event.release.tag_name }}
      - name: Set package tag
        id: package-tag
        env:
          PACKAGE_NAME: '@harperfast/harper-pro'
          VERSION: ${{ steps.version-components.outputs.version }}
          PRERELEASE: ${{ steps.version-components.outputs.prerelease }}
          RELEASE_LINE: ${{ steps.version-components.outputs.major }}.${{ steps.version-components.outputs.minor }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == '' ]]; then
            baseTag=latest
          else
            baseTag=next
          fi
          # Only move the base tag forward: a maintenance release (e.g. 5.2.x
          # published after 5.3.x) must not steal `latest` from a newer line —
          # it gets a line-scoped tag (e.g. `latest-5.2`) instead.
          # E404 means the tag doesn't exist yet (first publish); any other npm
          # error must abort — treating it as "no tag" would steal the tag.
          viewStatus=0
          currentVersion=$(npm view "$PACKAGE_NAME@$baseTag" version 2>"$RUNNER_TEMP/npm-view.err") || viewStatus=$?
          if [[ $viewStatus -ne 0 ]]; then
            if grep -q 'code E404' "$RUNNER_TEMP/npm-view.err"; then
              currentVersion=''
            else
              cat "$RUNNER_TEMP/npm-view.err" >&2
              exit "$viewStatus"
            fi
          fi
          if [[ -z "$currentVersion" ]]; then
            packageTag=$baseTag
          else
            highest=$(npx --yes semver@7.8.5 "$VERSION" "$currentVersion" | tail -1)
            if [[ "$highest" == "$VERSION" ]]; then
              packageTag=$baseTag
            else
              packageTag=$baseTag-$RELEASE_LINE
            fi
          fi
          echo "Publishing $PACKAGE_NAME@$VERSION with dist-tag '$packageTag' (current $baseTag: ${currentVersion:-none})"
          echo "packageTag=$packageTag" >> "$GITHUB_OUTPUT"
      - name: Publish package to NPM registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access=public --tag=${{ steps.package-tag.outputs.packageTag }} harperfast-harper-pro-*.tgz

  send-slack-message-on-success:
    if: success() && !cancelled()
    needs: [publish-npm-package]
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack published notification
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#development-ci",
              "text": "Harper Pro v${{ needs.publish-npm-package.outputs.harper-pro-version }} has been published to NPM",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Harper Pro v${{ needs.publish-npm-package.outputs.harper-pro-version }} release"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": ":white_check_mark: Published to :npm:"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "<https://www.npmjs.com/package/@harperfast/harper-pro/v/${{ needs.publish-npm-package.outputs.harper-pro-version }}|@harperfast/harper-pro@${{ needs.publish-npm-package.outputs.harper-pro-version }}>"
                    }
                  ]
                }
              ]
            }

  send-slack-message-on-failure:
    if: failure() && !cancelled()
    needs: [publish-npm-package]
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#development-ci",
              "text": "Harper Pro v${{ needs.publish-npm-package.outputs.harper-pro-version }} NPM publish failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Harper Pro v${{ needs.publish-npm-package.outputs.harper-pro-version }} release"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": ":x: Failed to publish to :npm:"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run ${{ github.run_id }}>"
                    }
                  ]
                }
              ]
            }
