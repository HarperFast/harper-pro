name: Publish NPM Package

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-npm-package:
    runs-on: ubuntu-latest
    outputs:
      harper-pro-version: ${{ steps.version-components.outputs.version }}
      harper-pro-dist-tag: ${{ steps.package-tag.outputs.reportedTag }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get release build
        env:
          GH_TOKEN: ${{ github.token }}
        # Retry up to 5 times with 15s backoff: GitHub can briefly make assets
        # unavailable via the API when a draft release is published.
        run: |
          for i in 1 2 3 4 5; do
            gh release download ${{ github.event.release.tag_name }} --pattern "harperfast-harper-pro-*.tgz" && break
            if [ "$i" -eq 5 ]; then echo "All attempts failed"; exit 1; fi
            echo "Attempt $i failed; retrying in 15s..."
            sleep 15
          done
      - name: Get version components
        id: version-components
        uses: matt-usurp/validate-semver@c5050374644a5ab2e03ddca02ce8d282911620ce # v3.0.0
        with:
          version: ${{ github.event.release.tag_name }}
      - name: Set package tag
        id: package-tag
        env:
          PACKAGE_NAME: '@harperfast/harper-pro'
          VERSION: ${{ steps.version-components.outputs.version }}
          PRERELEASE: ${{ steps.version-components.outputs.prerelease }}
          RELEASE_LINE: ${{ steps.version-components.outputs.major }}.${{ steps.version-components.outputs.minor }}
        run: |
          set -euo pipefail

          # npm applies `--tag` unconditionally, so nothing but this step keeps a
          # moving tag from going backwards when release lines publish out of order.
          #
          # One lookup of the whole dist-tags map, rather than one `npm view` per
          # tag: an absent tag is then simply a missing key, so there is no error
          # string to classify. Per-tag lookups could not tell "this tag does not
          # exist yet" from "the registry 404'd the package" — both report E404 —
          # and reading the second as the first would hand `latest` to an older
          # release during a registry blip. Any failure here ends the step; a brand
          # new package would need its first publish bootstrapped by hand, which is
          # a loud failure rather than a silent one.
          distTags=$(npm view "$PACKAGE_NAME" dist-tags --json)

          tagVersion() {
            jq -r --arg tag "$1" '.[$tag] // ""' <<< "$distTags"
          }

          advances() {
            if [[ -z "$1" ]]; then
              return 0
            fi
            local highest
            highest=$(npx --yes semver@7.8.5 "$VERSION" "$1" | tail -1) || exit $?
            [[ "$highest" == "$VERSION" ]]
          }

          if [[ "$PRERELEASE" == '' ]]; then
            baseTag=latest
          else
            baseTag=next
          fi
          lineTag=$baseTag-$RELEASE_LINE

          baseVersion=$(tagVersion "$baseTag")
          lineVersion=$(tagVersion "$lineTag")

          # The line tag may not exist yet while the base tag already holds a version
          # from this same line; seeding from it stops a late patch creating the line
          # tag on an older version than the line has already shipped.
          if [[ -z "$lineVersion" && "$baseVersion" == "$RELEASE_LINE."* ]]; then
            lineVersion=$baseVersion
          fi

          if advances "$baseVersion"; then
            packageTag=$baseTag
          elif advances "$lineVersion"; then
            packageTag=$lineTag
          else
            # npm always applies some tag.
            packageTag=tmp-publish-$VERSION
            echo "throwawayTag=$packageTag" >> "$GITHUB_OUTPUT"
          fi

          # The throwaway tag is removed moments later, so naming it in the
          # notification would point operators at a 404.
          reportedTag=$packageTag
          if [[ "$packageTag" == tmp-publish-* ]]; then
            reportedTag="untagged (install by exact version)"
          fi
          echo "reportedTag=$reportedTag" >> "$GITHUB_OUTPUT"

          echo "Publishing $PACKAGE_NAME@$VERSION with dist-tag '$packageTag' ($baseTag: ${baseVersion:-none}, $lineTag: ${lineVersion:-none})"
          echo "packageTag=$packageTag" >> "$GITHUB_OUTPUT"
      - name: Publish package to NPM registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_TAG: ${{ steps.package-tag.outputs.packageTag }}
        run: npm publish --access=public --tag="$PACKAGE_TAG" harperfast-harper-pro-*.tgz
      # `always()`: a publish can commit the version and still report failure, and a
      # re-run then stops at "already published" before ever reaching this step, so a
      # throwaway tag skipped here would outlive every chance to remove it.
      - name: Drop the throwaway dist-tag
        if: always() && steps.package-tag.outputs.throwawayTag != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: '@harperfast/harper-pro'
          THROWAWAY_TAG: ${{ steps.package-tag.outputs.throwawayTag }}
        run: |
          set -euo pipefail
          # Assigned before testing so a registry failure ends the step: a silent
          # "no tag to remove" would strand the throwaway tag behind a green job.
          publishedTags=$(npm dist-tag ls "$PACKAGE_NAME")
          # Exact field compare, not grep: the tag contains `.`, which a regex would
          # treat as a wildcard.
          if awk -F': ' -v tag="$THROWAWAY_TAG" '$1 == tag { found = 1 } END { exit !found }' <<<"$publishedTags"; then
            npm dist-tag rm "$PACKAGE_NAME" "$THROWAWAY_TAG"
          else
            echo "No $THROWAWAY_TAG tag to remove"
          fi

  send-slack-message-on-success:
    if: success() && !cancelled()
    needs: [publish-npm-package]
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack published notification
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#development-ci",
              "text": "Harper Pro v${{ needs.publish-npm-package.outputs.harper-pro-version }} has been published to NPM under dist-tag `${{ needs.publish-npm-package.outputs.harper-pro-dist-tag }}`",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Harper Pro v${{ needs.publish-npm-package.outputs.harper-pro-version }} release"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": ":white_check_mark: Published to :npm: as `${{ needs.publish-npm-package.outputs.harper-pro-dist-tag }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "<https://www.npmjs.com/package/@harperfast/harper-pro/v/${{ needs.publish-npm-package.outputs.harper-pro-version }}|@harperfast/harper-pro@${{ needs.publish-npm-package.outputs.harper-pro-version }}>"
                    }
                  ]
                }
              ]
            }

  send-slack-message-on-failure:
    if: failure() && !cancelled()
    needs: [publish-npm-package]
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "#development-ci",
              "text": "Harper Pro v${{ needs.publish-npm-package.outputs.harper-pro-version }} NPM publish failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Harper Pro v${{ needs.publish-npm-package.outputs.harper-pro-version }} release"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": ":x: Failed to publish to :npm:"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run ${{ github.run_id }}>"
                    }
                  ]
                }
              ]
            }
