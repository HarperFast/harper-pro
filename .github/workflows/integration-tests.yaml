name: Integration Tests

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+']
  pull_request:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - '22'
          - '24'
          - '26'

jobs:
  generate-node-version-matrix:
    name: Generate Node Version Matrix
    runs-on: ubuntu-latest
    outputs:
      node-versions: ${{ steps.set-node-versions.outputs.node-versions }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'

      - name: Set Node versions
        id: set-node-versions
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # PR pushes run a single representative Node version to keep the dev loop fast;
            # the full 22/24/26 matrix runs on push to main/release and on the nightly schedule.
            echo "node-versions=[24]" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.node-version }}" == "all" ] || [ -z "${{ github.event.inputs.node-version }}" ]; then
            # TEMPORARY: pinned to 26.5.0 instead of floating "26" — 26.5.1's llhttp/undici bump
            # (deps: llhttp 9.4.2->9.4.3, undici 8.7.0->8.9.0) breaks analytics.test.mjs,
            # addNodeLeaderNoMeshLeak.test.mjs, and the Cluster 6/6 shard on Node 26 only. The
            # harper-side counterpart (a TTL-reset-on-write race made visible by the same bump,
            # confirmed via a curl-based discriminator that rules out an undici-client artifact)
            # is documented on harper#2025; harper-pro's own root cause was not traced to the same
            # depth in this pass. Remove this pin once the underlying issue is fixed — see
            # harper#2025, which stays open until then.
            echo "node-versions=[22, 24, \"26.5.0\"]" >> $GITHUB_OUTPUT
          else
            # Manual dispatch intentionally does NOT apply the 26.5.0 pin above: selecting "26"
            # here floats to the latest 26.x release, so it doubles as the live reproducer for
            # checking whether harper#2025 is still reproducing on the newest Node 26 patch.
            echo "node-versions=[${{ github.event.inputs.node-version }}]" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Harper Pro (Node.js v${{ matrix.node-version }})
    needs: generate-node-version-matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.generate-node-version-matrix.outputs.node-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
          # A manual workflow_dispatch with node-version: '26' is meant to float to the latest
          # 26.x release; without this, setup-node would silently prefer whatever 26.x is
          # already in the runner's tool cache. Scoped to that one floating case so the normal
          # pinned-version jobs (22, 24, "26.5.0") don't pay an extra manifest lookup every run.
          check-latest: ${{ matrix.node-version == '26' }}

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build || true # we currently have type errors so just ignore that

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-build-artifacts-node-${{ matrix.node-version }}
          path: |
            dist/
            static/
            node_modules/
            package.json
          retention-days: 1

  run-integration-tests:
    name: Integration Tests ${{matrix.shard}}/3 (Node.js v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [generate-node-version-matrix, build]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.generate-node-version-matrix.outputs.node-versions) }}
        # Non-cluster is the light tier (~16 single-process files); the heavy cluster
        # tier (~40 multi-process files) runs in its own job below with more shards.
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
          # A manual workflow_dispatch with node-version: '26' is meant to float to the latest
          # 26.x release; without this, setup-node would silently prefer whatever 26.x is
          # already in the runner's tool cache. Scoped to that one floating case so the normal
          # pinned-version jobs (22, 24, "26.5.0") don't pay an extra manifest lookup every run.
          check-latest: ${{ matrix.node-version == '26' }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harper-build-artifacts-node-${{ matrix.node-version }}

      - name: Relink bin scripts
        run: npm install --ignore-scripts

      # re2 downloads its native binary from a post-install script (unlike lmdb/msgpackr/rocksdb,
      # which bundle prebuilds), so --ignore-scripts above leaves it absent. Materialize it here.
      - name: Build re2 native binary
        run: npm rebuild re2

      - name: Install harperdb@4 for legacy tests
        run: |
          mkdir -p /tmp/harperdb-legacy
          npm install --ignore-scripts --prefix /tmp/harperdb-legacy harperdb@4

      # A zero-match glob makes node:test's run() silently collect no tests and exit 0
      # (a false green). Fail loudly instead if the extglob exclusion ever stops expanding.
      - name: Guard against empty non-cluster test glob
        env:
          PATTERN: 'integrationTests/!(cluster)/**/*.test.*s'
        run: |
          count=$(node -e "console.log(require('node:fs').globSync(process.env.PATTERN).length)")
          echo "non-cluster test files matched: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::non-cluster glob '$PATTERN' matched 0 files on $(node --version) — the extglob exclusion is not expanding, so this job would run no tests."
            exit 1
          fi

      - name: Run Integration Test Shard ${{ matrix.shard }}
        env:
          HARPER_INTEGRATION_TEST_LOG_DIR: /tmp/harper-integration-test-logs
          HARPER_LEGACY_VERSION_PATH: /tmp/harperdb-legacy/node_modules/harperdb
          # Cap concurrent test files at 2: several multi-node replication suites
          # run heavy clusters, and the default (availableParallelism/2+1) let too
          # many run at once on CI runners, starving each other into shard timeouts.
          HARPER_INTEGRATION_TEST_CONCURRENCY: '2'
        run: |
          npm run test:integration:non-cluster -- --shard=${{ matrix.shard }}/3

      - name: Upload Harper server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-server-logs-node-${{ matrix.node-version }}-shard-${{ matrix.shard }}
          path: /tmp/harper-integration-test-logs/
          retention-days: 3
          if-no-files-found: ignore

  run-cluster-tests:
    name: Cluster Integration Tests ${{matrix.shard}}/6 (Node.js v${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [generate-node-version-matrix, build]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.generate-node-version-matrix.outputs.node-versions) }}
        # Heavy tier: ~40 files each booting 2–4 Harper processes — more shards than
        # the non-cluster job to keep per-shard wall-clock and timeout headroom sane.
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
          # A manual workflow_dispatch with node-version: '26' is meant to float to the latest
          # 26.x release; without this, setup-node would silently prefer whatever 26.x is
          # already in the runner's tool cache. Scoped to that one floating case so the normal
          # pinned-version jobs (22, 24, "26.5.0") don't pay an extra manifest lookup every run.
          check-latest: ${{ matrix.node-version == '26' }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harper-build-artifacts-node-${{ matrix.node-version }}

      - name: Relink bin scripts
        run: npm install --ignore-scripts

      # re2 downloads its native binary from a post-install script (unlike lmdb/msgpackr/rocksdb,
      # which bundle prebuilds), so --ignore-scripts above leaves it absent. Materialize it here.
      - name: Build re2 native binary
        run: npm rebuild re2

      - name: Install harperdb@4 for legacy tests
        run: |
          mkdir -p /tmp/harperdb-legacy
          npm install --ignore-scripts --prefix /tmp/harperdb-legacy harperdb@4

      - name: Guard against empty cluster test glob
        env:
          PATTERN: 'integrationTests/cluster/**/*.test.*s'
        run: |
          count=$(node -e "console.log(require('node:fs').globSync(process.env.PATTERN).length)")
          echo "cluster test files matched: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::cluster glob '$PATTERN' matched 0 files on $(node --version) — this job would run no tests."
            exit 1
          fi

      - name: Run Cluster Integration Test Shard ${{ matrix.shard }}
        env:
          HARPER_INTEGRATION_TEST_LOG_DIR: /tmp/harper-integration-test-logs
          HARPER_LEGACY_VERSION_PATH: /tmp/harperdb-legacy/node_modules/harperdb
          # Cap concurrent test files at 2: several multi-node replication suites
          # run heavy clusters, and the default (availableParallelism/2+1) let too
          # many run at once on CI runners, starving each other into shard timeouts.
          HARPER_INTEGRATION_TEST_CONCURRENCY: '2'
        run: |
          npm run test:integration:cluster -- --shard=${{ matrix.shard }}/6

      - name: Upload Harper server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-cluster-server-logs-node-${{ matrix.node-version }}-shard-${{ matrix.shard }}
          path: /tmp/harper-integration-test-logs/
          retention-days: 3
          if-no-files-found: ignore

  # Non-blocking-of-required-checks nightly canary for the pin above (harper#2025): the default
  # matrix no longer exercises Node >=26.5.1 at all, so this keeps a signal alive on whatever the
  # latest 26.x release is. "Non-blocking" refers only to the `if:` gate (schedule/dispatch-26,
  # never pull_request, never in any other job's `needs`) — verified against this repo's actual
  # branch-protection ruleset, this job cannot appear as or block a required check, so there is
  # no continue-on-error anywhere in it: a reproduction fails the job for real and shows as a
  # plain red X, which is a more honest signal than a green run with a buried warning. Targets
  # the exact files AND case names harper#2025 names (verified via grep, not a guess at shard-6
  # membership — `replicationTopology.test.mjs` contains all three of "replicate per-record
  # expiration...", "Replicate larger v4 dataset...", and "Bridge teardown: remove_node...").
  #
  # Known residual risk, recorded here rather than fixed by this job (see harper#2025):
  #   - Two of the three harper-pro failures are on the legacy-v4 replication bridge, a data
  #     path this pass did not trace to the same depth as the harper-side TTL-reset defect —
  #     unlike that defect, it has NOT been confirmed as production-vs-test-only here.
  #   - harper#2025 itself reports the Cluster 6/6 shard failing "3 of last 4 runs" — roughly a
  #     25% per-run false-negative rate on these exact cases. One green nightly run is a sample,
  #     not proof the regression cleared; don't unpin off a single green.
  #   - This canary covers only these three files, not the rest of the replication/broker/
  #     operations-API surface that sits on the same llhttp/undici stack.
  canary-node26-latest:
    name: Canary — Node 26 latest (harper#2025, non-blocking)
    if: github.event_name == 'schedule' || github.event.inputs.node-version == '26'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'

      - name: Setup Node.js 26 (floating latest)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
          # Without this, setup-node prefers whatever 26.x is already in the runner's tool
          # cache over querying for the actual latest release — silently defeating the whole
          # point of this job once Node 26 lands in the ubuntu-latest image's default toolcache.
          check-latest: true

      - name: Record resolved Node version
        run: |
          echo "Resolved Node version: $(node --version)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm install --ignore-scripts

      # re2 downloads its native binary from a post-install script (unlike lmdb/msgpackr/rocksdb,
      # which bundle prebuilds), so --ignore-scripts above leaves it absent. Materialize it here.
      - name: Build re2 native binary
        run: npm rebuild re2

      - name: Build
        run: npm run build || true # we currently have type errors so just ignore that

      - name: Install harperdb@4 for legacy tests
        # Without this, replicationTopology.test.mjs's three legacy-v4-bridge cases —
        # including the two harper#2025 lists (`Replicate larger v4 dataset...`, `Bridge
        # teardown: remove_node disconnects legacy v4 node cleanly`) — bail out with a bare
        # `return` when HARPER_LEGACY_VERSION_PATH is unset, which node:test scores as a pass.
        # The canary would report green while never actually exercising the cases it exists
        # to watch. Mirrors run-cluster-tests above.
        run: |
          mkdir -p /tmp/harperdb-legacy
          npm install --ignore-scripts --prefix /tmp/harperdb-legacy harperdb@4

      - name: Guard against a moved/renamed canary target, or a missing build output
        run: |
          for f in "dist/bin/harper.js" \
                   "integrationTests/analytics/analytics.test.mjs" \
                   "integrationTests/cluster/addNodeLeaderNoMeshLeak.test.mjs" \
                   "integrationTests/cluster/replicationTopology.test.mjs"; do
            if [ ! -f "$f" ]; then
              echo "::error::canary target missing: $f — a moved/renamed test would silently match nothing and exit 0; a missing dist/bin/harper.js means the 'npm run build || true' above swallowed a real build failure."
              exit 1
            fi
          done
          # A file surviving a rename doesn't mean the specific harper#2025 cases inside it
          # do — checking file existence alone would still pass if these were renamed/dropped.
          for name in "Replicate larger v4 dataset across multiple tables" \
                      "Bridge teardown: remove_node disconnects legacy v4 node cleanly" \
                      "replicate per-record expiration so records evict on receivers"; do
            if ! grep -qF "$name" "integrationTests/cluster/replicationTopology.test.mjs"; then
              echo "::error::canary target case missing: '$name' no longer found in replicationTopology.test.mjs — the file still exists, but this specific harper#2025 case does not."
              exit 1
            fi
          done

      # This job is gated to schedule/workflow_dispatch only (never pull_request, never in any
      # other job's `needs`), so it cannot appear as or block a required check — verified against
      # the repo's actual branch-protection ruleset, not assumed. There is therefore nothing for
      # continue-on-error to protect here, and using it would only invert this job's signal: a
      # real harper#2025 reproduction would show as a green ✅ with a warning buried inside, which
      # is worse than the plain red ✗ a canary should show. Let it fail naturally.
      - name: Run harper#2025 canary tests
        env:
          HARPER_INTEGRATION_TEST_LOG_DIR: /tmp/harper-integration-test-logs
          HARPER_LEGACY_VERSION_PATH: /tmp/harperdb-legacy/node_modules/harperdb
          # Same cap as run-integration-tests/run-cluster-tests above — without it these three
          # files (two of them multi-node cluster suites) run concurrently and can starve each
          # other into a timeout that reads as a Node-26 regression rather than resource
          # contention.
          HARPER_INTEGRATION_TEST_CONCURRENCY: '2'
        run: |
          npm run test:integration -- \
            "integrationTests/analytics/analytics.test.mjs" \
            "integrationTests/cluster/addNodeLeaderNoMeshLeak.test.mjs" \
            "integrationTests/cluster/replicationTopology.test.mjs"

      - name: Upload Harper server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-server-logs-canary-node26-latest
          path: /tmp/harper-integration-test-logs/
          retention-days: 3
          if-no-files-found: ignore
