# Gates PR merges on companion PRs in other repos (typically harper core).
#
# Add one or more markers to a PR body:
#   Depends-on: HarperFast/harper#2147
#   Depends-on: harper#2147            (same-org shorthand)
#   Depends-on: https://github.com/HarperFast/harper/pull/2147
#
# A marker line may only contain refs in those forms (comma/space separated);
# anything else on the line fails the check rather than being ignored.
#
# The `companion-check` commit status stays pending until every referenced PR
# is merged, and fails if one closes without merging (or if a marker is
# present but empty/unparseable — the gate fails closed). With `companion-check`
# configured as a required status check, approving a PR and arming auto-merge
# queues it to merge automatically once its companions land. No commits are
# pushed to the PR after approval (`require_last_push_approval` would void
# the approval), so a coordinated PR merges with its `core` pointer still on
# the companion's branch commit — status quo for the manual flow. To promptly
# re-point core at harper main, merging a Depends-on PR fires the existing
# `sync_core` repository_dispatch instead of waiting for the nightly run
# (Sync Core resets core's branch tracking to the default first, so a merged
# `core:set-branch` override cannot wedge it).
#
# PRs without a marker get `success` unless they move a submodule pointer
# (e.g. `core`) onto a commit not yet on the submodule repo's settle branch:
# its branch named like the PR's base if one exists, else its default branch.
# Such a PR fails until its body declares the companion PR carrying that
# commit; a PR with a marker is judged on its companions alone. Ordinary PRs,
# submodule removals and bumps between settled commits stay green, and a PR
# touching no gitlink costs one PR-files listing (plus one head-tree read when
# GitHub omits a file's patch). The cron sweep reconciles every open PR, so it
# also backfills statuses after this workflow first lands, heals any status a
# dropped webhook left behind, and clears a failure once the pointer's commit
# lands on the settle branch.
#
# Referencing a private repo requires a `COMPANION_CHECK_TOKEN` secret with
# pull-request read access to that repo; public repos (harper) work with
# GITHUB_TOKEN. The secret is only used for same-org refs on non-fork PRs, and
# never for submodule lookups (the submodule URL is PR-controlled), so a
# private submodule repo reads as unreadable and holds the status at pending.
#
# Maintenance rule for `pull_request_target`: never add a checkout step and
# never interpolate PR-controlled text into `run:` or expressions beyond
# `contains()` membership tests — the PR body must only be handled as data
# inside github-script.
#
# Logic is covered by build-tools/companion-check.test.mjs (plain node, no deps).

name: Companion Check

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, closed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  statuses: write
  pull-requests: read
  contents: read

concurrency:
  group: companion-check-${{ github.event.pull_request.number || 'sweep' }}-${{ github.event.action == 'closed' && 'merge' || 'eval' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && github.event.action != 'closed' }}

jobs:
  evaluate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # A sweep takes seconds; a hung API read must not hold the sweep queue.
    timeout-minutes: 10
    steps:
      - name: Evaluate companion dependencies
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMPANION_CHECK_TOKEN: ${{ secrets.COMPANION_CHECK_TOKEN }}
        with:
          # Per request, 1s/4s/9s backoff; github-script's default exempt list keeps 400/401/403/404/422 fatal.
          retries: 3
          script: |
            const STATUS_CONTEXT = 'companion-check';
            const MAX_DEPS = 10;
            const { owner, repo } = context.repo;
            const crossToken = process.env.COMPANION_CHECK_TOKEN || '';
            const isSweep = context.eventName !== 'pull_request_target';
            const apiUrl = context.apiUrl || 'https://api.github.com';
            const depCache = new Map();

            function parseDeps(body) {
              const deps = [];
              let unparseable = false;
              const lineRe = /^[^\S\r\n]*depends[- ]on:[ \t]*(.*)$/gim;
              const refRe =
                /https:\/\/github\.com\/([\w.-]+)\/([\w.-]+)\/pull\/(\d+)|([\w.-]+)\/([\w.-]+)#(\d+)|([\w.-]+)#(\d+)/g;
              const badSegment = (s) => s.includes('..') || s.startsWith('.');
              for (const [, refs] of (body || '').matchAll(lineRe)) {
                let matched = 0;
                for (const m of refs.matchAll(refRe)) {
                  matched++;
                  const dep = m[3]
                    ? { owner: m[1], repo: m[2], number: +m[3] }
                    : m[6]
                      ? { owner: m[4], repo: m[5], number: +m[6] }
                      : { owner, repo: m[7], number: +m[8] };
                  if (badSegment(dep.owner) || badSegment(dep.repo)) unparseable = true;
                  else deps.push(dep);
                }
                // Anything on the line that is not a recognized ref fails closed.
                if (!matched || refs.replace(refRe, '').replace(/[\s,;]+/g, '')) unparseable = true;
              }
              const seen = new Set();
              const unique = deps.filter((dep) => {
                const key = `${dep.owner}/${dep.repo}#${dep.number}`.toLowerCase();
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
              });
              return { deps: unique, unparseable };
            }

            const refOf = (dep) => `${dep.owner}/${dep.repo}#${dep.number}`;
            const stateOf = (data) =>
              data.merged ? 'merged' : data.state === 'open' ? 'open' : 'closed';

            async function depState(dep, allowSecret) {
              const cacheKey = `${allowSecret}:${refOf(dep).toLowerCase()}`;
              if (depCache.has(cacheKey)) return depCache.get(cacheKey);
              const state = await depStateUncached(dep, allowSecret);
              depCache.set(cacheKey, state);
              return state;
            }

            async function depStateUncached(dep, allowSecret) {
              try {
                const { data } = await github.rest.pulls.get({
                  owner: dep.owner,
                  repo: dep.repo,
                  pull_number: dep.number,
                });
                return stateOf(data);
              } catch (e) {
                if (e.status !== 404) return `unreadable (${e.status || e.message})`;
                // 404 falls through: definitive miss unless the secret can see more.
              }
              // Oracle guard: the secret never serves foreign-org refs or fork PRs.
              if (crossToken && allowSecret && dep.owner.toLowerCase() === owner.toLowerCase()) {
                try {
                  const res = await fetch(
                    `${apiUrl}/repos/${encodeURIComponent(dep.owner)}/${encodeURIComponent(dep.repo)}/pulls/${dep.number}`,
                    {
                      headers: {
                        authorization: `Bearer ${crossToken}`,
                        accept: 'application/vnd.github+json',
                        'user-agent': 'companion-check',
                      },
                    }
                  );
                  if (res.ok) return stateOf(await res.json());
                  return res.status === 404 ? 'missing' : `unreadable (${res.status})`;
                } catch (e) {
                  return `unreadable (${e.message})`;
                }
              }
              return 'missing';
            }

            const lookupCache = new Map();
            // Repo names are case-insensitive; branch names are not.
            const memo = (sub, key, lookup) => {
              key = `${sub.owner}/${sub.repo}`.toLowerCase() + key;
              if (!lookupCache.has(key)) lookupCache.set(key, lookup());
              return lookupCache.get(key);
            };
            const readError = (e) => `(${e.status || e.message})`;
            const submoduleUrlRe =
              /^(?:https:\/\/github\.com\/|git@github\.com:|ssh:\/\/git@github\.com\/)([\w.-]+)\/([\w.-]+?)(?:\.git)?\/?$/;
            // The only segments that would move an API path: the URL pattern admits no `/`.
            const dotSegment = (s) => s === '.' || s === '..';

            const MAX_LISTED_FILES = 3000; // pulls.listFiles stops here, however it is paged

            // A gitlink's patch adds `Subproject commit <sha>` with `sha` equal to that commit; a
            // regular file's `sha` is its blob id, which cannot appear in its own content.
            const isGitlinkPatch = (f) =>
              f.patch?.match(/^\+Subproject commit ([0-9a-f]{40})$/m)?.[1] === f.sha;

            // GitHub omits `patch` for binary and empty files, and for every file past a page's
            // diff-size budget (zeroing its line counts too), so the head tree decides those.
            async function headGitlinkPaths(pr) {
              try {
                const { data } = await github.rest.git.getTree({
                  owner,
                  repo,
                  tree_sha: pr.head.sha,
                  recursive: 'true',
                });
                if (data.truncated) return { error: 'Cannot check submodule pointers: PR head tree truncated' };
                return { paths: new Set(data.tree.filter((e) => e.type === 'commit').map((e) => e.path)) };
              } catch (e) {
                return { error: `Cannot read the PR head tree ${readError(e)}` };
              }
            }

            async function submoduleAt(pr, path) {
              let data;
              try {
                ({ data } = await github.rest.repos.getContent({ owner, repo, path, ref: pr.head.sha }));
              } catch (e) {
                return { error: `Cannot read submodule ${path} ${readError(e)}` };
              }
              const m = data.type === 'submodule' && submoduleUrlRe.exec(data.submodule_git_url || '');
              if (!m || dotSegment(m[1]) || dotSegment(m[2]))
                return { error: `Cannot resolve the GitHub repo of submodule ${path}` };
              return { sub: { owner: m[1], repo: m[2] }, sha: data.sha };
            }

            // Keep in step with settleBranch in Dispatch's dispatch/lib/companion.mjs, the pre-PR check.
            function settleBranch(sub, base) {
              return memo(sub, `:settle:${base}`, async () => {
                try {
                  await github.rest.repos.getBranch({ ...sub, branch: base });
                  return { branch: base };
                } catch (e) {
                  if (e.status !== 404) return { error: readError(e) };
                }
                try {
                  const { data } = await github.rest.repos.get(sub);
                  return { branch: data.default_branch };
                } catch (e) {
                  return { error: readError(e) };
                }
              });
            }

            function isSettled(sub, branch, sha) {
              return memo(sub, `:compare:${branch}...${sha}`, async () => {
                try {
                  const { data } = await github.rest.repos.compareCommitsWithBasehead({
                    ...sub,
                    basehead: `${branch}...${sha}`,
                    per_page: 1,
                  });
                  if (data.status === 'behind' || data.status === 'identical') return { settled: true };
                  if (data.status === 'ahead' || data.status === 'diverged') return { settled: false };
                  return { error: `(compare status ${data.status})` };
                } catch (e) {
                  return { error: readError(e) };
                }
              });
            }

            async function evaluateUndeclared(pr) {
              let files;
              try {
                files = await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100,
                });
              } catch (e) {
                return { state: 'pending', description: `Cannot list PR files ${readError(e)}` };
              }
              if (files.length >= MAX_LISTED_FILES)
                return {
                  state: 'pending',
                  description: `Cannot check submodule pointers past GitHub's ${MAX_LISTED_FILES}-file PR listing`,
                };
              const kept = files.filter((f) => f.status !== 'removed');
              const paths = kept.filter(isGitlinkPatch).map((f) => f.filename);
              const settled = [];
              let unreadable;
              const patchless = kept.filter((f) => !f.patch);
              if (patchless.length) {
                const head = await headGitlinkPaths(pr);
                if (head.error) unreadable = head.error;
                else paths.push(...patchless.map((f) => f.filename).filter((path) => head.paths.has(path)));
              }
              for (const path of paths) {
                const gitlink = await submoduleAt(pr, path);
                if (gitlink.error) {
                  unreadable ??= gitlink.error;
                  continue;
                }
                const { sub, sha } = gitlink;
                const nwo = `${sub.owner}/${sub.repo}`;
                const settle = await settleBranch(sub, pr.base.ref);
                if (settle.error) {
                  unreadable ??= `Cannot read ${nwo} branches ${settle.error}`;
                  continue;
                }
                const check = await isSettled(sub, settle.branch, sha);
                if (check.error) {
                  unreadable ??= `Cannot check ${path} against ${nwo} ${settle.branch} ${check.error}`;
                  continue;
                }
                if (check.settled) {
                  settled.push(`${path} on ${nwo} ${settle.branch}`);
                  continue;
                }
                return {
                  state: 'failure',
                  description: `${path} is on ${nwo}@${sha.slice(0, 7)}, not yet on ${settle.branch}: add "Depends-on: ${nwo}#<PR>" naming its PR, or re-point it`,
                };
              }
              if (unreadable) return { state: 'pending', description: unreadable };
              return {
                state: 'success',
                description: settled.length
                  ? `No companion dependencies (${settled.join(', ')})`
                  : 'No companion dependencies',
              };
            }

            async function evaluate(pr, { deps, unparseable }, allowSecret) {
              if (unparseable)
                return {
                  state: 'failure',
                  description: 'Empty or unparseable Depends-on marker (use owner/repo#N or a PR URL)',
                };
              if (!deps.length) return evaluateUndeclared(pr);
              if (deps.length > MAX_DEPS)
                return {
                  state: 'failure',
                  description: `More than ${MAX_DEPS} companion PRs referenced`,
                };
              const states = [];
              for (const dep of deps)
                states.push({ ref: refOf(dep), state: await depState(dep, allowSecret) });
              const closed = states.find((s) => s.state === 'closed');
              if (closed)
                return { state: 'failure', description: `${closed.ref} closed without merging` };
              const missing = states.find((s) => s.state === 'missing');
              if (missing)
                return {
                  state: 'failure',
                  description: `${missing.ref} not found or inaccessible (typo? private repo needs COMPANION_CHECK_TOKEN?)`,
                };
              const unreadable = states.find((s) => s.state.startsWith('unreadable'));
              if (unreadable)
                return {
                  state: 'pending',
                  description: `Cannot read ${unreadable.ref} ${unreadable.state.slice(11)}`,
                };
              const open = states.filter((s) => s.state === 'open');
              if (open.length)
                return {
                  state: 'pending',
                  description: `Waiting on ${open.map((s) => s.ref).join(', ')}`,
                };
              return {
                state: 'success',
                description: `All companion PRs merged (${states.map((s) => s.ref).join(', ')})`,
              };
            }

            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            async function postStatus(sha, state, description, options) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                context: STATUS_CONTEXT,
                state,
                description: description.slice(0, 140),
                target_url: runUrl,
                ...options,
              });
            }

            async function postIfChanged(pr, desired) {
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const description = desired.description.slice(0, 140);
              const current = statuses.find((s) => s.context === STATUS_CONTEXT);
              if (current && current.state === desired.state && current.description === description)
                return;
              if (isSweep) {
                // Sweep data may predate a racing PR event; the fresher run wins.
                const { data: fresh } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number,
                });
                if (
                  fresh.head.sha !== pr.head.sha ||
                  fresh.body !== pr.body ||
                  fresh.base.ref !== pr.base.ref
                )
                  return;
              }
              // A retried sweep write would land seconds after the freshness check and could
              // overwrite a newer PR-event verdict; a failure here falls back to pending instead.
              await postStatus(pr.head.sha, desired.state, description, isSweep && { request: { retries: 0 } });
              core.info(`${pr.number} -> ${desired.state}: ${description}`);
            }

            const prs =
              context.eventName === 'pull_request_target'
                ? [context.payload.pull_request]
                : await github.paginate(github.rest.pulls.list, {
                    owner,
                    repo,
                    state: 'open',
                    per_page: 100,
                  });
            let failures = 0;
            for (const pr of prs) {
              try {
                const allowSecret =
                  !!pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`;
                await postIfChanged(pr, await evaluate(pr, parseDeps(pr.body), allowSecret));
              } catch (e) {
                failures++;
                core.warning(`PR #${pr.number}: ${e.message}`);
                // A failed refresh must not leave a stale success behind.
                try {
                  await postStatus(pr.head.sha, 'pending', 'companion-check errored; next run will retry');
                } catch {}
              }
            }
            if (failures) core.setFailed(`${failures} PR(s) could not be updated`);

  normalize-core:
    # contains() is case-insensitive; both spellings the evaluator accepts
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.body, 'depends-on:') ||
       contains(github.event.pull_request.body, 'depends on:'))
    runs-on: ubuntu-latest
    steps:
      # App token: repository_dispatch events created with GITHUB_TOKEN do
      # not trigger workflows.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.HARPERFAST_AI_CLIENT_ID }}
          private-key: ${{ secrets.HARPERFAST_AI_APP_PRIVATE_KEY }}

      - name: Trigger core sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=sync_core
