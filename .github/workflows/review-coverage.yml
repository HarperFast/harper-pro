# PR-description checks. The action lives in HarperFast/harper, pinned by sha: GitHub does not let
# a public repo consume an action hosted in a private one, so harper holds the public copy and every
# other repo pins it.
#
# NEVER add a checkout step. On pull_request_target the workflow definition and the pinned action
# both come from trusted refs, and the job reads only the event payload — one slip to
# `ref: ...head.sha` would run arbitrary PR code with the base repo's token. Coverage needs no
# working tree, so there is nothing here that wants one. Same rule as companion-check.yaml.
#
# format_mode is left at its default of `off`: this repo checks coverage only, so no PR-files
# artifact is collected and no API token scope beyond the default read is needed.
name: review-coverage
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: review-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: HarperFast/harper/.github/actions/review-coverage@61c53b040a5b51a190218ee6d9bcd7751d7d9db0 # pending HarperFast/harper#2552; re-pin to the merge commit before this leaves draft
        with:
          mode: enforce
