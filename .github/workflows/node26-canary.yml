name: Node 26 Canary (harper#2025)

# Non-blocking canary for the temporary Node-26 CI pin in integration-tests.yaml: that pin holds
# the default matrix's Node-26 entry at 26.5.0 because 26.5.1's llhttp/undici bump breaks
# analytics.test.mjs, addNodeLeaderNoMeshLeak.test.mjs, and the Cluster 6/6 shard (see
# harper#2025), so the default matrix no longer exercises Node >=26.5.1 at all. This workflow
# keeps a signal alive on whatever the latest 26.x release is, in its own file with its own
# schedule and its own conclusion — deliberately NOT a job inside integration-tests.yaml,
# because harper#2025 reproduces today, so this job is expected to fail every night until it's
# fixed. A job that fails by design inside integration-tests.yaml would make that workflow's
# overall nightly conclusion permanently "failure", which is exactly the boolean nightly-gate
# triage reads before it drills into individual jobs — burying a genuine unrelated regression
# under an already-known, waved-off red. Keeping it in its own workflow lets it report the plain
# red X a canary should show without corrupting a monitored workflow's signal. Remove this
# workflow when the pin in integration-tests.yaml comes out — see harper#2025, which stays open
# until then.
#
# Targets the exact files AND case names harper#2025 names (verified via grep, not a guess at
# shard-6 membership — `replicationTopology.test.mjs` contains all three of "replicate
# per-record expiration...", "Replicate larger v4 dataset...", and "Bridge teardown:
# remove_node...").
#
# Known residual risk, recorded here rather than fixed by this job (see harper#2025):
#   - Two of the three harper-pro failures are on the legacy-v4 replication bridge, a data path
#     this pass did not trace to the same depth as the harper-side TTL-reset defect — unlike
#     that defect, it has NOT been confirmed as production-vs-test-only here. Before removing
#     the integration-tests.yaml pin, run the same curl/raw-socket discriminator against this
#     bridge path that was already run harper-side, and record server-vs-client on harper#2025.
#   - The integration-tests.yaml pin also applies to release branches (v[0-9]+.[0-9]+), but this
#     workflow only runs from the default branch (GitHub only triggers `schedule` there) or a
#     manual dispatch — a release cut off a v* branch gets no >=26.5.1 signal from this canary
#     at all.
#   - harper#2025 itself reports the Cluster 6/6 shard failing "3 of last 4 runs" — roughly a
#     25% per-run false-negative rate on these exact cases. One green nightly run is a sample,
#     not proof the regression cleared; don't unpin off a single green.
#   - This canary covers only these three files, not the rest of the replication/broker/
#     operations-API surface that sits on the same llhttp/undici stack.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

jobs:
  canary-node26-latest:
    name: Canary — Node 26 latest (harper#2025, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: 'recursive'

      - name: Setup Node.js 26 (floating latest)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
          # Without this, setup-node prefers whatever 26.x is already in the runner's tool
          # cache over querying for the actual latest release — silently defeating the whole
          # point of this job once Node 26 lands in the ubuntu-latest image's default toolcache.
          check-latest: true

      - name: Assert we actually resolved a Node newer than the pin
        # check-latest REQUESTS the newest 26.x; it does not guarantee one lands (a degraded
        # manifest lookup falls back to the toolcache). Silently running the pinned version
        # again and reporting green would be the canary's worst failure mode: it would look
        # like "latest Node 26 is clean" while >=26.5.1 was never actually executed. Red and
        # inconclusive beats green and wrong.
        run: |
          resolved="$(node --version)"
          echo "Resolved Node version: $resolved" | tee -a "$GITHUB_STEP_SUMMARY"
          node -e '
            const [maj, min, patch] = process.versions.node.split(".").map(Number);
            const pinned = [26, 5, 0];
            const newer = maj > pinned[0]
              || (maj === pinned[0] && min > pinned[1])
              || (maj === pinned[0] && min === pinned[1] && patch > pinned[2]);
            if (!newer) {
              console.error(`::error::resolved Node ${process.versions.node} is not newer than the 26.5.0 pin — check-latest likely fell back to a cached/lagged version. This run cannot demonstrate anything about harper#2025 on >=26.5.1 and must not be read as a pass.`);
              process.exit(1);
            }
          '

      - name: Install dependencies
        run: npm install --ignore-scripts

      # re2 downloads its native binary from a post-install script (unlike lmdb/msgpackr/rocksdb,
      # which bundle prebuilds), so --ignore-scripts above leaves it absent. Materialize it here.
      - name: Build re2 native binary
        run: npm rebuild re2

      - name: Build
        run: npm run build || true # we currently have type errors so just ignore that

      - name: Install harperdb@4 for legacy tests
        # Without this, replicationTopology.test.mjs's three legacy-v4-bridge cases —
        # including the two harper#2025 lists (`Replicate larger v4 dataset...`, `Bridge
        # teardown: remove_node disconnects legacy v4 node cleanly`) — bail out with a bare
        # `return` when HARPER_LEGACY_VERSION_PATH is unset, which node:test scores as a pass.
        # The canary would report green while never actually exercising the cases it exists
        # to watch. Mirrors run-cluster-tests in integration-tests.yaml.
        run: |
          mkdir -p /tmp/harperdb-legacy
          npm install --ignore-scripts --prefix /tmp/harperdb-legacy harperdb@4

      - name: Guard against a moved/renamed canary target, a missing build output, or a legacy install that didn't take
        run: |
          for f in "dist/bin/harper.js" \
                   "integrationTests/analytics/analytics.test.mjs" \
                   "integrationTests/cluster/addNodeLeaderNoMeshLeak.test.mjs" \
                   "integrationTests/cluster/replicationTopology.test.mjs"; do
            if [ ! -f "$f" ]; then
              echo "::error::canary target missing: $f — a moved/renamed test would silently match nothing and exit 0; a missing dist/bin/harper.js means the 'npm run build || true' above swallowed a real build failure."
              exit 1
            fi
          done
          # A file surviving a rename doesn't mean the specific harper#2025 cases inside it
          # do — checking file existence alone would still pass if these were renamed/dropped.
          for name in "Replicate larger v4 dataset across multiple tables" \
                      "Bridge teardown: remove_node disconnects legacy v4 node cleanly" \
                      "replicate per-record expiration so records evict on receivers"; do
            if ! grep -qF "$name" "integrationTests/cluster/replicationTopology.test.mjs"; then
              echo "::error::canary target case missing: '$name' no longer found in replicationTopology.test.mjs — the file still exists, but this specific harper#2025 case does not."
              exit 1
            fi
          done
          # The two v4-bridge cases short-circuit on a bare `return` (not a skip) if the legacy
          # harperdb install above didn't land where HARPER_LEGACY_VERSION_PATH points — that
          # would report as a pass via zero assertions run, not a failure. This only checks the
          # install landed; it can't confirm the earlier "Replicate data from a legacy node" case
          # populated ctx.nodes[NODE_COUNT], which the two bridge cases also require.
          if [ ! -d "/tmp/harperdb-legacy/node_modules/harperdb" ]; then
            echo "::error::legacy harperdb@4 install missing at /tmp/harperdb-legacy/node_modules/harperdb — the v4-bridge cases would silently no-op instead of running."
            exit 1
          fi

      # No continue-on-error anywhere in this job: it lives in its own workflow specifically so
      # it CAN fail honestly (see the header comment) without corrupting integration-tests.yaml's
      # conclusion. Let it fail naturally. timeout-minutes is on this step, not just the job, so
      # a wedged fetch/undici hang still leaves the job in a real `failure()` state (a
      # job-level-only timeout cancels rather than fails, which skips the log upload below).
      - name: Run harper#2025 canary tests
        timeout-minutes: 40
        env:
          HARPER_INTEGRATION_TEST_LOG_DIR: /tmp/harper-integration-test-logs
          HARPER_LEGACY_VERSION_PATH: /tmp/harperdb-legacy/node_modules/harperdb
          # Same cap as run-integration-tests/run-cluster-tests in integration-tests.yaml —
          # without it these three files (two of them multi-node cluster suites) run
          # concurrently and can starve each other into a timeout that reads as a Node-26
          # regression rather than resource contention.
          HARPER_INTEGRATION_TEST_CONCURRENCY: '2'
        run: |
          npm run test:integration -- \
            "integrationTests/analytics/analytics.test.mjs" \
            "integrationTests/cluster/addNodeLeaderNoMeshLeak.test.mjs" \
            "integrationTests/cluster/replicationTopology.test.mjs"

      - name: Upload Harper server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harper-server-logs-canary-node26-latest
          path: /tmp/harper-integration-test-logs/
          retention-days: 3
          if-no-files-found: ignore
